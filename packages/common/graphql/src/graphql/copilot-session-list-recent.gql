#import "./fragments/copilot.gql"

query getCopilotRecentSessions(
  $workspaceId: String!
  $limit: Int = 10
) {
  currentUser {
    copilot(workspaceId: $workspaceId) {
      chats(
        pagination: { first: $limit }
        options: {
          sessionOrder: desc
          withMessages: true
        }
      ) {
        ...PaginatedCopilotChats
      }
    }
  }
}
