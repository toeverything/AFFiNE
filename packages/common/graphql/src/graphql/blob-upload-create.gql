mutation createBlobUpload(
  $workspaceId: String!
  $key: String!
  $size: Int!
  $mime: String!
  $anonymousGuestToken: String
) {
  createBlobUpload(
    workspaceId: $workspaceId
    key: $key
    size: $size
    mime: $mime
    anonymousGuestToken: $anonymousGuestToken
  ) {
    method
    blobKey
    alreadyUploaded
    uploadUrl
    headers
    expiresAt
    uploadId
    partSize
    uploadedParts {
      partNumber
      etag
    }
  }
}
