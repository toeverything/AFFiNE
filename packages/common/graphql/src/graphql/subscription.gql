query subscription {
  currentUser {
    id
    subscriptionBilling {
      subscriptions {
        id
        status
        plan
        recurring
        start
        end
        nextBillAt
        canceledAt
        variant
        provider
        iapStore
      }
      conflicts {
        plan
        sources {
          id
          provider
          iapStore
          recurring
        }
      }
      manageable {
        plan
        sources {
          id
          provider
          iapStore
          recurring
        }
      }
    }
  }
}
