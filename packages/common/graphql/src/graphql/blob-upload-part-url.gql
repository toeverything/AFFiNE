query getBlobUploadPartUrl(
  $workspaceId: String!
  $key: String!
  $uploadId: String!
  $partNumber: Int!
  $anonymousGuestToken: String
) {
  workspace(id: $workspaceId) {
    blobUploadPartUrl(
      key: $key
      uploadId: $uploadId
      partNumber: $partNumber
      anonymousGuestToken: $anonymousGuestToken
    ) {
      uploadUrl
      headers
      expiresAt
    }
  }
}
