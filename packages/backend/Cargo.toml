[workspace]
exclude = ["native", "server"]
members = [
  "test-db-harness",
  "server-types",
  "server-db",
  "server-spi",
  "server-domain",
  "server-mail",
  "server-blob",
  "server-sync",
  "server-search",
  "server-http",
  "server-worker",
  "affine-server",
]
resolver = "3"

[workspace.package]
edition      = "2024"
license      = "MIT"
publish      = false
rust-version = "1.88"

[workspace.dependencies]
aes-gcm            = "0.10"
arc-swap           = "1"
argon2             = "0.5"
async-graphql      = { version = "7", features = ["chrono", "uuid"] }
async-graphql-axum = "7"
async-trait        = "0.1"
axum               = { version = "0.8", features = ["macros", "ws"] }
base64             = "0.22"
brotli             = "9"
bytes              = "1"
chrono             = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap               = { version = "4", features = ["derive", "env"] }
crc32fast          = "1"
encoding_rs        = "0.8"
flate2             = "1"
futures-util       = "0.3"
hex                = "0.4"
hickory-resolver   = "0.26.2"
hkdf               = "0.12"
hmac               = "0.12"
http               = "1"
image              = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
jiff               = { version = "0.2", default-features = false, features = ["std", "tzdb-zoneinfo", "tzdb-concatenated"] }
lettre             = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
lru                = "0.12"
mailparse          = "0.16"
memory-indexer     = "0.4.1"
p256               = { version = "0.13", features = ["ecdsa", "pem"] }
postgres           = "0.19"
rand               = "0.9"
redis              = { version = "0.27", features = ["tokio-comp", "aio"] }
reqwest            = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring               = "0.17.14"
rusty-s3           = "0.10"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
sha2               = "0.10"
assetpack-core     = { version = "0.4.2", default-features = false, features = ["file-transform"] }
assetpack-transform-precomp2 = "0.4.4"
sqlx               = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite", "chrono", "uuid", "json"] }
subtle             = "2"
thiserror          = "2"
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "process"] }
tower              = "0.5"
tower-http         = { version = "0.6", features = ["cors", "trace"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
unicode_skeleton   = "0.1.1"
url                = "2.5"
uuid               = { version = "1", features = ["v4", "serde"] }
v_htmlescape       = "0.15"
xmlparser          = "0.13"
y-octo             = { version = "0.4.2", features = ["large_refs"] }
y-octo-core        = "0.1.1"
zeroize            = "1"
zstd               = "0.14"

affine-server   = { path = "affine-server" }
frame-audit     = { path = "../../tools/frame-audit" }
server-blob     = { path = "server-blob" }
server-db       = { path = "server-db" }
server-domain   = { path = "server-domain" }
server-http     = { path = "server-http" }
server-mail     = { path = "server-mail" }
server-search   = { path = "server-search" }
server-spi      = { path = "server-spi" }
server-sync     = { path = "server-sync" }
server-types    = { path = "server-types" }
server-worker   = { path = "server-worker" }
test-db-harness = { path = "test-db-harness" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
