[package]
edition      = "2024"
license-file = "LICENSE"
name         = "affine_server_native"
publish      = false
version      = "1.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
affine_core = "0.0.4"
aes-gcm = { workspace = true }
affine_common = { workspace = true, features = ["hashcash", "napi"] }
affine_doc_loader = { workspace = true }
anyhow = { workspace = true }
argon2 = "0.5"
assetpack-core = "0.1.0"
assetpack-transform-precomp2 = "0.1.0"
base64 = { workspace = true }
chrono = { workspace = true }
crc32fast = "1.5.0"
doc_extractor = { workspace = true }
file-format = { workspace = true }
futures-util = { workspace = true }
gcp_auth = { version = "0.12.7", features = ["webpki-roots"] }
hex = { workspace = true }
hickory-resolver = "0.26.1"
hkdf = { workspace = true }
hmac = "0.13"
homedir = { workspace = true }
image = { workspace = true }
infer = { workspace = true }
instant-xml = "0.7.5"
jsonschema = "0.47"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
libwebp-sys = "0.9.6"
little_exif = { workspace = true }
llm_adapter = { workspace = true, features = ["schema", "ureq-client"] }
llm_runtime = { workspace = true, features = ["schema", "ureq-client"] }
matroska = { workspace = true }
memory-indexer = { workspace = true }
mp4parse = { workspace = true }
napi = { workspace = true, features = ["async", "serde-json"] }
napi-derive = { workspace = true }
p256 = { workspace = true }
rand = { workspace = true }
redis = { workspace = true }
reqwest = { version = "0.13.4", default-features = false, features = [
  "form",
  "json",
  "query",
  "rustls",
] }
rustls = { version = "0.23", default-features = false, features = [
  "aws-lc-rs",
  "std",
  "tls12",
] }
rusty-s3 = "0.10.0"
safefetch = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
subtle = "2"
sqlx = { workspace = true, default-features = false, features = [
  "chrono",
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "uuid",
] }
thiserror.workspace = true
tiktoken-rs = { workspace = true }
tokio = { workspace = true, features = [
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
unicode-normalization = "0.1"
unicode_skeleton = "0.1.1"
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
v_htmlescape = { workspace = true }
webpki-roots = "1.0"
y-octo = { workspace = true, features = ["large_refs"] }
zeroize = { workspace = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
mimalloc = { workspace = true }

[target.'cfg(all(target_os = "linux", not(target_arch = "arm")))'.dependencies]
mimalloc = { workspace = true, features = ["local_dynamic_tls"] }

[dev-dependencies]
rayon    = { workspace = true }
tempfile = "3.27.0"
tokio    = { workspace = true, features = ["macros", "rt-multi-thread"] }

[build-dependencies]
napi-build = { workspace = true }
