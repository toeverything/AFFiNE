[package]
name = "ui"
workspace = "../../frontend"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[features]
default = ["font-kit"]
harness = []
font-kit = ["dep:font-kit", "dep:core-text", "dep:objc2-core-text", "dep:pathfinder_geometry"]
runtime_shaders = []
leak-detection = []

[dependencies]
anyhow.workspace = true
async-task.workspace = true
backtrace.workspace = true
bitflags.workspace = true
derive_more.workspace = true
etagere.workspace = true
flume.workspace = true
frame-audit.workspace = true
futures.workspace = true
heapless.workspace = true
icu_segmenter.workspace = true
image.workspace = true
indexmap.workspace = true
itertools.workspace = true
jiff.workspace = true
log.workspace = true
lyon.workspace = true
num_cpus.workspace = true
parking.workspace = true
parking_lot.workspace = true
pin-project.workspace = true
rand.workspace = true
raw-window-handle.workspace = true
regex.workspace = true
resvg.workspace = true
rustc-hash.workspace = true
seahash.workspace = true
serde.workspace = true
serde_json.workspace = true
slotmap.workspace = true
smallvec.workspace = true
smol_str.workspace = true
spin.workspace = true
strum.workspace = true
taffy.workspace = true
thiserror.workspace = true
ttf-parser.workspace = true
unicode-bidi.workspace = true
unicode-segmentation.workspace = true
url.workspace = true
usvg.workspace = true
uuid.workspace = true
waker-fn.workspace = true
web-time.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-channel = { workspace = true, features = ["std"] }
pollster.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
async-channel.workspace = true
bytemuck.workspace = true
console_error_panic_hook.workspace = true
cosmic-text.workspace = true
getrandom.workspace = true
jiff = { workspace = true, features = ["js"] }
js-sys.workspace = true
swash.workspace = true
unicode-bidi.workspace = true
unicode-properties.workspace = true
unicode-script.workspace = true
uuid = { workspace = true, features = ["js"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "console",
    "Blob",
    "Clipboard",
    "ClipboardEvent",
    "ClipboardItem",
    "CompositionEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "EventTarget",
    "File",
    "FocusOptions",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlTextAreaElement",
    "IdleDeadline",
    "IdleRequestOptions",
    "ImageData",
    "InputEvent",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MouseEvent",
    "Navigator",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "PointerEvent",
    "ResizeObserver",
    "ResizeObserverBoxOptions",
    "ResizeObserverEntry",
    "ResizeObserverOptions",
    "ResizeObserverSize",
    "Screen",
    "Storage",
    "TextMetrics",
    "VisualViewport",
    "WheelEvent",
    "Window",
] }
wgpu = { workspace = true, features = ["webgl", "webgpu", "wgsl"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
bytemuck.workspace = true
cosmic-text.workspace = true
libc.workspace = true
swash.workspace = true
unicode-bidi.workspace = true
wgpu = { workspace = true, features = ["std", "vulkan", "gles", "wgsl"] }

[target.'cfg(target_os = "linux")'.dependencies]
font-kit = { workspace = true, optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
block2.workspace = true
core-foundation.workspace = true
core-foundation-sys.workspace = true
core-graphics.workspace = true
core-text = { workspace = true, optional = true }
ctor.workspace = true
dispatch2 = { workspace = true, features = ["block2", "objc2"] }
font-kit = { workspace = true, optional = true, features = ["source"] }
foreign-types.workspace = true
libc.workspace = true
mach2.workspace = true
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-text = { workspace = true, optional = true }
objc2-core-video.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
objc2-quartz-core.workspace = true
objc2-uniform-type-identifiers.workspace = true
pathfinder_geometry = { workspace = true, optional = true }
semver.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.build-dependencies]
cbindgen.workspace = true
