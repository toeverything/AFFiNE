[package]
name = "affine-desktop"
workspace = ".."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
harness = ["ui/harness", "ui-kit/harness"]

[[bin]]
name = "desktop-harness"
path = "src/bin/desktop_harness/main.rs"
required-features = ["harness"]

[dependencies]
affine-client = { path = "../client" }
affine-legacy-import = { path = "../legacy-import" }
affine-store = { path = "../../common/store", default-features = false }
anyhow.workspace = true
blocksuite-editor = { path = "../../../blocksuite/crates/editor" }
blocksuite-playground-doc = { path = "../../../blocksuite/crates/doc", default-features = false }
blocksuite-preview = { path = "../../../blocksuite/crates/preview" }
playground = { path = "../../../blocksuite/crates/playground" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ui = { path = "../../ui/ui" }
ui-kit = { path = "../../ui/kit" }
ui-tokens = { path = "../../ui/tokens" }
y-octo.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
image.workspace = true
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

[dev-dependencies]
ui = { path = "../../ui/ui", features = ["harness"] }
