<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="affine-version" content="0.27.5" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src https://challenges.cloudflare.com; base-uri 'none'; object-src 'none'"
    />
    <title>Sign in to AFFiNE</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-subtle: #f4f4f5;
        --text: #141414;
        --text-secondary: #52525b;
        --border: #d4d4d8;
        --primary: #0b6bcb;
        --primary-hover: #0958a8;
        --primary-text: #ffffff;
        --link: #0b6bcb;
        --error: #b91c1c;
        --focus-ring: rgba(11, 107, 203, 0.28);
        --shadow: 0 8px 28px rgba(0, 0, 0, 0.07);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --surface: #1c1c1e;
          --surface-subtle: #262629;
          --text: #f4f4f5;
          --text-secondary: #a1a1aa;
          --border: #323236;
          --primary: #0b6bcb;
          --primary-hover: #147ae0;
          --primary-text: #ffffff;
          --link: #60b5ff;
          --error: #fca5a5;
          --focus-ring: rgba(96, 181, 255, 0.36);
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        min-height: 100dvh;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(20px + env(safe-area-inset-top, 0px))
          calc(16px + env(safe-area-inset-right, 0px))
          calc(24px + env(safe-area-inset-bottom, 0px))
          calc(16px + env(safe-area-inset-left, 0px));
      }

      #auth-card {
        width: 100%;
        max-width: 358px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px 22px 24px;
        box-shadow: var(--shadow);
      }

      .brand-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--surface-subtle);
        border: 1px solid var(--border);
        color: var(--text);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }

      .brand-mark svg {
        width: 24px;
        height: 24px;
        display: block;
      }

      #auth-heading {
        margin: 0;
        font-size: 22px;
        line-height: 1.25;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .auth-subtitle {
        margin: 4px 0 0;
        font-size: 14px;
        line-height: 1.4;
        color: var(--text-secondary);
      }

      #auth-status {
        margin: 0 0 12px;
        font-size: 13px;
        line-height: 1.45;
        color: var(--text-secondary);
      }

      #auth-status:empty {
        display: none;
      }

      #auth-status[data-tone='error'] {
        color: var(--error);
      }

      #oauth-providers {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 0;
      }

      #oauth-providers[hidden],
      .step-section[hidden],
      .divider[hidden],
      [hidden] {
        display: none;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 16px 0;
        color: var(--text-secondary);
        font-size: 12px;
        text-transform: lowercase;
      }

      .divider::before,
      .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .step-section {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .email-pill {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--surface-subtle);
        border: 1px solid var(--border);
        font-size: 14px;
        font-weight: 500;
        word-break: break-all;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
      }

      input {
        width: 100%;
        min-height: 46px;
        font-size: 16px;
        line-height: 1.3;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        outline: none;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--focus-ring);
      }

      #otp {
        letter-spacing: 0.24em;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      #turnstile-container:empty {
        display: none;
      }

      button {
        width: 100%;
        min-height: 46px;
        font-size: 15px;
        line-height: 1.2;
        font-weight: 600;
        padding: 11px 16px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: background-color 0.15s ease;
      }

      button.btn-primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-text);
      }

      button.btn-primary:hover {
        background: var(--primary-hover);
      }

      button.oauth-btn,
      button.btn-secondary {
        background: var(--surface-subtle);
      }

      button.oauth-btn svg {
        width: 18px;
        height: 18px;
        flex: none;
      }

      button.btn-ghost {
        background: transparent;
        border-color: transparent;
        color: var(--link);
        min-height: 44px;
        font-weight: 500;
      }

      button.btn-subtle {
        background: transparent;
        border-color: transparent;
        color: var(--text-secondary);
        min-height: 44px;
        font-weight: 500;
        margin-top: 2px;
      }

      .step-actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .helper-text {
        margin: 0;
        font-size: 13px;
        line-height: 1.45;
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <main id="auth-card" data-step="email">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="55 25 360 325"
            fill="currentColor"
          >
            <path
              d="m404.14,313.34c-5.95-10.33-15.86-27.48-25.65-44.42-2.97-5.14-5.92-10.25-8.75-15.15-5.82-10.08-11.12-19.27-14.9-25.83-26.23-45.33-77.87-135.08-103.67-179.46-7.95-12.37-26.37-11.39-33.21,1.42-7.76,13.45-16.3,28.24-25.32,43.87-2.86,4.96-5.78,10.01-8.73,15.12-37.58,65.08-81.56,141.26-112.89,195.52-1.6,2.9-4.58,7.63-6.07,10.76-2.61,5.65-2.1,12.69,1.19,17.91,3.71,6.18,10.65,9.57,17.74,9.22,8.53,0,26.62-.01,50.01,0,5.55,0,11.4,0,17.49,0,81.33,0,205.57.05,236.06,0,14.81.03,24.1-16.21,16.72-28.97Zm-175.07-57.64l-14.97-25.93c-2.63-4.56.66-10.26,5.92-10.26h29.94c5.27,0,8.56,5.7,5.92,10.26l-14.97,25.93c-2.63,4.56-9.21,4.56-11.85,0Zm-25.08-48.29c-1.24-3.16-2.31-6.37-3.19-9.63l49.53,9.63h-46.34Zm22.62,68.22c-2.11,2.66-4.36,5.19-6.74,7.59l-16.43-47.71,23.16,40.12Zm47.78-53.7c3.35.5,6.67,1.19,9.93,2.05l-33.1,38.08,23.17-40.13Zm-76.64-40.4c-.53-4.82-.76-9.69-.74-14.57l65.41,31.91-64.68-17.33Zm-7.76,47.77l17.32,64.65c-3.91,2.87-8.01,5.51-12.25,7.93l-5.08-72.58Zm109.93.17c4.44,1.95,8.77,4.19,12.99,6.65l-60.34,40.7,47.35-47.35Zm-101.41-83.09c1.2-8.86,3.05-17.59,5.29-25.96l99.37,86.38-104.65-60.42Zm-22.02,164.51c-8.27,3.39-16.75,6.15-25.12,8.39l25.12-129.23v120.84Zm153.49-63.19c7.07,5.47,13.71,11.44,19.84,17.56l-124.49,42.86,104.65-60.42Zm-90.64-175.85c18.32,31.79,44.92,77.89,70.26,121.77l-94.61-94.61c5.56-9.62,10.83-18.75,15.69-27.18,1.93-3.33,6.73-3.33,8.66,0Zm-147.77,240.92c5.21-8.99,12.37-21.32,13.96-24.16,15.08-26.12,35.39-61.29,56.37-97.63l-34.65,129.3c-12.41,0-23.11,0-31.35,0-3.85,0-6.26-4.17-4.33-7.5Zm282.54,7.53c-28.89,0-84.98,0-140.67,0l129.31-34.65c6.78,11.74,12.21,21.14,15.69,27.16,1.93,3.33-.48,7.49-4.32,7.49Z"
            />
          </svg>
        </span>
        <div>
          <h1 id="auth-heading">Sign in to AFFiNE</h1>
          <p class="auth-subtitle">Sync your workspaces across devices</p>
        </div>
      </div>

      <p id="auth-status" role="status" aria-live="polite"></p>

      <form id="sign-in-form" method="post" action="/api/auth/sign-in">
        <div id="turnstile-container"></div>

        <section id="step-email" class="step-section">
          <div id="oauth-providers" hidden></div>
          <div id="oauth-divider" class="divider" hidden>or</div>

          <label for="email">
            Email
            <input
              id="email"
              name="username"
              type="email"
              autocomplete="username"
              placeholder="name@example.com"
              required
            />
          </label>
          <button id="submit-button" class="btn-primary" type="submit">
            Continue with email
          </button>

          <button id="use-local-btn" class="btn-subtle" type="button">
            Use local workspace
          </button>
        </section>

        <section id="step-password" class="step-section" hidden>
          <div id="step-email-display" class="email-pill"></div>
          <label for="password">
            Password
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
            />
          </label>
          <button id="password-submit-button" class="btn-primary" type="submit">
            Sign in
          </button>
          <div class="step-actions">
            <button id="switch-to-otp-btn" class="btn-ghost" type="button">
              Sign in with verification code
            </button>
            <button
              id="back-from-password-btn"
              class="btn-secondary"
              type="button"
            >
              Back
            </button>
          </div>
        </section>

        <section id="step-otp" class="step-section" hidden>
          <div id="otp-email-display" class="email-pill"></div>
          <p class="helper-text">
            Enter the 6-digit verification code sent to your email.
          </p>
          <label for="otp">
            Verification code
            <input
              id="otp"
              name="otp"
              type="text"
              inputmode="numeric"
              maxlength="6"
              autocomplete="one-time-code"
              placeholder="000000"
            />
          </label>
          <button id="otp-submit-button" class="btn-primary" type="submit">
            Continue
          </button>
          <div class="step-actions">
            <button id="resend-otp-btn" class="btn-ghost" type="button">
              Resend code
            </button>
            <button
              id="switch-to-password-btn"
              class="btn-ghost"
              type="button"
              hidden
            >
              Sign in with password
            </button>
            <button id="back-from-otp-btn" class="btn-secondary" type="button">
              Back
            </button>
          </div>
        </section>
      </form>
    </main>
    <script type="module" src="/src/sign-in.js"></script>
  </body>
</html>
