[package]
name = "affine-android-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
workspace = "../.."

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["preview-typst"]
host-jni = []
preview-typst = ["playground/preview-typst"]

[dependencies]
affine-legacy-import = { path = "../../legacy-import" }
affine-mobile = { path = "../../mobile" }
affine-store = { path = "../../../common/store" }
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
playground = { path = "../../../../blocksuite/crates/playground", default-features = false }
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smallvec.workspace = true
sqlx.workspace = true
tokio.workspace = true
ui = { path = "../../../ui/ui" }
url.workspace = true
uuid.workspace = true
y-octo.workspace = true

[lints]
workspace = true
