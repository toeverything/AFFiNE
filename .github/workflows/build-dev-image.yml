name: Build Dev Image

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-dev-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.from-source
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mosaic:dev
            ghcr.io/${{ github.repository_owner }}/mosaic:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
