name: Native Playground Mobile CI

on:
  push:
    branches:
      - 'darksky/np/mobile'
      - 'darksky/np/mobile-**'
  workflow_dispatch:

concurrency:
  group: np-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_ENCODED_RUSTFLAGS: ''
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: always

jobs:
  mobile-gates-and-web:
    name: L0, Invariants, Web Host & Preview Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: L0 Tier A static gates
        run: node scripts/ci/check-l0-tier-a.mjs

      - name: Web mobile thin host and perf comparator tests
        working-directory: packages/frontend
        run: |
          node --test hosts/web/tests/*.test.mjs
          node hosts/web/scripts/verify-zero-third-party-js.mjs
          node --test perf/compare-n3.test.mjs

      - name: Install Linux fontconfig, Mesa Lavapipe Vulkan, and CJK fallback font
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 libfontconfig1-dev libfreetype-dev fonts-wqy-zenhei

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/frontend -> target
          key: np-mobile-gates

      - name: Format, clippy, invariants, and host/preview/mobile tests
        working-directory: packages/frontend
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --features harness -- -D warnings
          cargo test --locked -p affine-android-host -p affine-ios-host -p blocksuite-preview --all-features
          cargo test --locked -p affine-mobile --all-targets
          cargo run --locked -p affine-mobile --features harness --bin mobile-harness -- audit-matrix
          cargo run --locked -p affine-mobile --features harness --bin mobile-harness -- fps-replay
          ./scripts/check-invariants.sh

  s1-probes-bench:
    name: S1 Release Probes (SQLite, Mermaid, RaTeX, Hayro PDF)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/frontend -> target
          key: np-mobile-s1-probes
          shared-key: np-mobile-s1-probes

      - name: Install Noto CJK font for 24-case Mermaid visual probes
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Run S1 release probes and validate artifacts
        working-directory: packages/frontend
        env:
          AFFINE_S1_OUT_DIR: /tmp/s1-artifacts
          AFFINE_CJK_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
        run: |
          rm -rf /tmp/s1-artifacts
          mkdir -p /tmp/s1-artifacts
          cargo test --locked --release -p affine-store --test s1_sqlite_probe -- --nocapture
          cargo test --locked --release -p blocksuite-preview --all-features --test s1_probes -- --nocapture
          test -s /tmp/s1-artifacts/s1-sqlite-report.json
          test -s /tmp/s1-artifacts/s1-probes-report.json
          PNG_COUNT=$(find /tmp/s1-artifacts -maxdepth 1 -name 'mermaid-*.png' | wc -l | tr -d ' ')
          echo "Generated Mermaid PNG count: $PNG_COUNT"
          test "$PNG_COUNT" -eq 24
          for theme in light dark; do
            for name in flowchart sequence state class pie er gantt gitgraph wrapped-latin wrapped-cjk generic-class frontmatter; do
              test -s "/tmp/s1-artifacts/mermaid-${theme}-${name}.png"
            done
          done

      - name: Upload S1 probes report and rendered PNG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: s1-probes-artifacts
          path: /tmp/s1-artifacts
          if-no-files-found: error

  preview-wasm-workers:
    name: Preview Wasm Workers (4 Independent Targets)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/frontend -> target
          key: np-mobile-preview-wasm

      - name: Install wasm-bindgen CLI and Binaryen wasm-opt
        run: |
          WBG_VERSION=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/"/, "", $3); print $3; exit}' Cargo.lock)
          URL="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WBG_VERSION}/wasm-bindgen-${WBG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          if curl -fsSL "$URL" | tar -xz -C /tmp; then
            sudo install -m 0755 "/tmp/wasm-bindgen-${WBG_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/wasm-bindgen
          else
            cargo install --locked wasm-bindgen-cli --version "$WBG_VERSION"
          fi
          wasm-bindgen --version
          BINARYEN_VERSION="version_123"
          BINARYEN_SHA256="e959f2170af4c20c552e9de3a0253704d6a9d2766e8fdb88e4d6ac4bae9388fe"
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            -o /tmp/binaryen.tar.gz
          echo "${BINARYEN_SHA256}  /tmp/binaryen.tar.gz" | sha256sum -c -
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          rm -f /tmp/binaryen.tar.gz
          sudo install -m 0755 "/tmp/binaryen-${BINARYEN_VERSION}/bin/wasm-opt" /usr/local/bin/wasm-opt
          wasm-opt --version

      - name: Build and verify main playground Wasm bundle and 4 preview Wasm workers
        run: |
          mkdir -p /tmp/preview-wasm/pkg
          for kind in mermaid math typst pdf; do
            case "$kind" in
              mermaid|typst) wasm_profile="wasm-release-size" ;;
              *) wasm_profile="wasm-release" ;;
            esac
            cargo build --locked --profile "$wasm_profile" -p blocksuite-preview --no-default-features --features "${kind},wasm-worker" --target wasm32-unknown-unknown
            wasm-opt -Oz --strip-debug --strip-producers \
              --enable-bulk-memory \
              --enable-nontrapping-float-to-int \
              --enable-sign-ext \
              --enable-mutable-globals \
              "target/wasm32-unknown-unknown/${wasm_profile}/blocksuite_preview.wasm" \
              -o "/tmp/preview-wasm/${kind}.wasm"
            test -s "/tmp/preview-wasm/${kind}.wasm"
          done
          cargo build --locked --profile wasm-release -p playground --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir /tmp/preview-wasm/pkg target/wasm32-unknown-unknown/wasm-release/playground.wasm
          wasm-opt -Oz --strip-debug --strip-producers \
            --enable-bulk-memory \
            --enable-nontrapping-float-to-int \
            --enable-sign-ext \
            --enable-mutable-globals \
            /tmp/preview-wasm/pkg/playground_bg.wasm \
            -o /tmp/preview-wasm/pkg/playground_bg.opt.wasm
          mv /tmp/preview-wasm/pkg/playground_bg.opt.wasm /tmp/preview-wasm/pkg/playground_bg.wasm
          test -s /tmp/preview-wasm/pkg/playground_bg.wasm
          node hosts/web/scripts/stage-preview-workers.mjs /tmp/preview-wasm dev-local
          node hosts/web/scripts/verify-preview-workers-e2e.mjs

      - name: Verify real-browser IndexedDB storage and V1 Yjs extraction
        run: node hosts/web/scripts/verify-idb-real-browser.mjs

      - name: Verify real-browser S3-Web GPU recovery, selection menu, and lazy hayro PDF worker
        run: node hosts/web/scripts/verify-s3-web-real-browser.mjs

  android-host:
    name: Android Thin Host (NDK .so Link & kotlinc)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with Android target
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/frontend -> target
          key: np-mobile-android-host

      - name: Install Linux fontconfig and freetype headers for host tests
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libfreetype-dev

      - name: Link Android NDK arm64-v8a .so binary
        working-directory: packages/frontend
        run: |
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          cargo build --locked -p affine-android-host --target aarch64-linux-android
          SRC="target/aarch64-linux-android/debug/libaffine_android_host.so"
          test -s "$SRC"
          DST="/tmp/libaffine_android_host_aarch64-linux-android.stripped.so"
          cp "$SRC" "$DST"
          "$NDK_BIN/llvm-strip" --strip-unneeded "$DST"
          BYTES=$(stat -c '%s' "$DST")
          MAX_BYTES=165000000
          echo "Stripped aarch64-linux-android libaffine_android_host.so bytes: ${BYTES} (max ${MAX_BYTES})"
          test "$BYTES" -le "$MAX_BYTES"

      - name: Compile Android thin host Kotlin sources with kotlinc and run real JNI parity check
        run: |
          ANDROID_JAR=$(ls -1 "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -n 1)
          echo "Using Android SDK jar: $ANDROID_JAR"
          cargo build --locked --manifest-path packages/frontend/Cargo.toml -p affine-android-host --features host-jni
          test -s packages/frontend/target/debug/libaffine_android_host.so
          mkdir -p /tmp/affine-android-kotlin
          kotlinc -classpath "$ANDROID_JAR" \
            -d /tmp/affine-android-kotlin \
            packages/frontend/hosts/android/kotlin/app/affine/pro/host/MainActivity.kt \
            packages/frontend/hosts/android/kotlin/app/affine/pro/host/LegacyLocalStorageProbe.kt \
            packages/frontend/hosts/android/kotlin/app/affine/pro/host/AndroidBootstrapCoordinator.kt \
            packages/frontend/hosts/android/kotlin/app/affine/pro/host/AuthDataStore.kt \
            packages/frontend/hosts/android/kotlin/app/affine/pro/host/ShareIntentBridge.kt \
            packages/frontend/hosts/android/tests/ImeHostParityCheck.kt
          test -s /tmp/affine-android-kotlin/app/affine/pro/host/MainActivity.class
          test -s /tmp/affine-android-kotlin/app/affine/pro/host/AffineImeController.class
          test -s /tmp/affine-android-kotlin/app/affine/pro/host/AffineInputConnection.class
          test -s /tmp/affine-android-kotlin/app/affine/pro/host/LegacyLocalStorageProbe.class
          test -s /tmp/affine-android-kotlin/app/affine/pro/host/AndroidBootstrapCoordinator.class
          test -s /tmp/affine-android-kotlin/app/affine/pro/host/AuthSessionStore.class
          test -s /tmp/affine-android-kotlin/app/affine/pro/host/AuthTokenCipher.class
          kotlin -J-Djava.library.path="$PWD/packages/frontend/target/debug" \
            -cp "/tmp/affine-android-kotlin:$ANDROID_JAR" \
            ImeHostParityCheckKt

  ios-host:
    name: iOS Thin Host (Rust staticlib & Swift Simulator Link)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with iOS targets
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/frontend -> target
          key: np-mobile-ios-host
          add-rust-environment-hash-key: false
          cache-on-failure: true

      - name: Build affine-ios-host staticlib and check device targets
        working-directory: packages/frontend
        run: |
          cargo test --locked -p affine-ios-host --lib
          cargo check --locked -p ui -p affine-ios-host --target aarch64-apple-ios
          CARGO_PROFILE_DEV_PACKAGE_MERMAN_OPT_LEVEL=0 \
          CARGO_PROFILE_DEV_PACKAGE_MERMAN_ANALYSIS_OPT_LEVEL=0 \
          CARGO_PROFILE_DEV_PACKAGE_MERMAN_ASCII_OPT_LEVEL=0 \
          CARGO_PROFILE_DEV_PACKAGE_MERMAN_CORE_OPT_LEVEL=0 \
          CARGO_PROFILE_DEV_PACKAGE_MERMAN_EDITOR_CORE_OPT_LEVEL=0 \
          CARGO_PROFILE_DEV_PACKAGE_MERMAN_ELK_LAYERED_OPT_LEVEL=0 \
          CARGO_PROFILE_DEV_PACKAGE_MERMAN_LAYOUT_ELK_OPT_LEVEL=0 \
          CARGO_PROFILE_DEV_PACKAGE_MERMAN_MARKUP_OPT_LEVEL=0 \
          CARGO_PROFILE_DEV_PACKAGE_MERMAN_MODEL_OPT_LEVEL=0 \
          CARGO_PROFILE_DEV_PACKAGE_MERMAN_RENDER_OPT_LEVEL=0 \
          CARGO_PROFILE_DEV_PACKAGE_MERMAN_THEME_CONTRACT_OPT_LEVEL=0 \
            cargo build --locked -p affine-ios-host --target aarch64-apple-ios-sim
          test -s target/aarch64-apple-ios-sim/debug/libaffine_ios_host.a
          IOS_LIB_BYTES=$(stat -f '%z' target/aarch64-apple-ios-sim/debug/libaffine_ios_host.a)
          echo "iOS staticlib libaffine_ios_host.a bytes: ${IOS_LIB_BYTES}"
          test "$IOS_LIB_BYTES" -le 650000000

      - name: Link zero-CocoaPods Swift iOS host and run 6/6 Simulator smoke tests
        run: |
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, devs in sorted(data.items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devs:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      print(d["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          echo "Booting iOS Simulator UDID concurrently with Swift linking: $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" || true
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          SMOKE_SOURCES=()
          for f in packages/frontend/hosts/ios/Sources/*.swift; do
            case "$(basename "$f")" in
              AppDelegate.swift|SceneDelegate.swift|main.swift) continue ;;
            esac
            SMOKE_SOURCES+=("$f")
          done

          swiftc -emit-executable \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0-simulator \
            -import-objc-header packages/frontend/hosts/ios/include/affine_mobile_host.h \
            -L packages/frontend/target/aarch64-apple-ios-sim/debug \
            -laffine_ios_host \
            -framework UIKit \
            -framework QuartzCore \
            -framework Metal \
            -framework WebKit \
            -framework PDFKit \
            -framework CoreText \
            -framework CoreGraphics \
            -framework CoreVideo \
            -framework CoreFoundation \
            -framework Foundation \
            -framework UniformTypeIdentifiers \
            -o /tmp/AffineIosHost \
            packages/frontend/hosts/ios/Sources/*.swift &
          PID_APP=$!

          swiftc -emit-executable \
            -sdk "$SDK" \
            -target arm64-apple-ios16.0-simulator \
            -import-objc-header packages/frontend/hosts/ios/include/affine_mobile_host.h \
            -L packages/frontend/target/aarch64-apple-ios-sim/debug \
            -laffine_ios_host \
            -framework UIKit \
            -framework QuartzCore \
            -framework Metal \
            -framework WebKit \
            -framework PDFKit \
            -framework CoreText \
            -framework CoreGraphics \
            -framework CoreVideo \
            -framework CoreFoundation \
            -framework Foundation \
            -framework UniformTypeIdentifiers \
            -o /tmp/IosHostS3SmokeTest \
            "${SMOKE_SOURCES[@]}" \
            packages/frontend/hosts/ios/tests/IosHostS3SmokeTest.swift &
          PID_SMOKE=$!

          wait "$PID_APP"
          wait "$PID_SMOKE"
          test -s /tmp/AffineIosHost
          test -s /tmp/IosHostS3SmokeTest

          echo "Running iOS smoke tests on Simulator UDID: $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl spawn "$SIM_UDID" /tmp/IosHostS3SmokeTest

      - name: Shutdown iOS Simulator
        if: always() && env.SIM_UDID != ''
        run: xcrun simctl shutdown "$SIM_UDID" || true
