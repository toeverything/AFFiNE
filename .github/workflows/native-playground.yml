name: Native Playground CI

on:
  push:
    branches:
      - 'darksky/native-playground'
      - 'darksky/np/**'

concurrency:
  group: native-playground-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_ENCODED_RUSTFLAGS: ''
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Changed Paths
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.filter.outputs.web }}
      web-build: ${{ steps.filter.outputs.web-build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the merge base and the previous push are present.
          fetch-depth: 0

      - name: Resolve the base commit
        id: base
        env:
          BEFORE: ${{ github.event.before }}
        # Topic branches compare with their merge base on the integration
        # branch; the integration branch compares with the commit before this
        # push, or its parent when that commit is unknown (new branch, force
        # push). Always a commit SHA, never a branch name.
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = darksky/native-playground ]; then
            if [ -n "${BEFORE//0/}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              sha=$BEFORE
            else
              sha=$(git rev-parse HEAD~1)
            fi
          else
            sha=$(git merge-base origin/darksky/native-playground HEAD)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.base.outputs.sha }}
          # JavaScript under scripts/oracle and tools/parity-harness also runs
          # the web lane: its lint and format checks cover those files.
          filters: |
            web:
              - '**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,css}'
              - '**/package.json'
              - '**/tsconfig*.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - '.yarn/**'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - '.github/actions/setup-node/**'
              - '.github/workflows/np-web-fast.yml'
            web-build:
              - 'packages/frontend/**'
              - 'packages/common/**'
              - 'blocksuite/**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,css,json}'
              - 'tools/cli/**'
              - '**/package.json'
              - '**/tsconfig*.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - '.yarn/**'
              - '.github/actions/setup-node/**'
              - '.github/workflows/np-web-build.yml'

  web-fast:
    name: Web Fast Checks
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/np-web-fast.yml

  web-build:
    name: Web Build
    needs: changes
    if: needs.changes.outputs.web-build == 'true'
    uses: ./.github/workflows/np-web-build.yml

  server-harness-check:
    name: L0 Tier A, Server Contracts & Test Harness
    runs-on: ubuntu-24.04
    env:
      # One installed toolchain for crates/ and tools/parity-harness alike.
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          playwright-install: false
          full-cache: true

      - name: L0 Tier A static gates
        run: node scripts/ci/check-l0-tier-a.mjs

      - name: Frozen v0.27.5 server contracts
        run: |
          node scripts/oracle/extract-v0275-contracts.mjs --check
          node scripts/oracle/test-extractor.mjs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates -> target
            tools/parity-harness -> target
          key: server-harness

      - name: Pull pinned test images
        run: |
          docker pull -q docker.io/pgvector/pgvector:pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f &
          docker pull -q docker.io/library/redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe &
          wait

      - name: Format, clippy and test crates/ (real PostgreSQL and Redis) and the parity harness
        working-directory: crates
        run: |
          mkdir -p ../.artifacts/server-harness
          status=passed
          timings=()
          step() {
            local name=$1; shift
            local start=$(date +%s%3N)
            echo "::group::$name"
            "$@" || status=failed
            echo "::endgroup::"
            timings+=(--timing "$name=$(( $(date +%s%3N) - start ))")
          }
          step fmt cargo fmt --all -- --check
          step clippy cargo clippy --locked --workspace --all-targets -- -D warnings
          step test cargo test --locked --workspace
          parity=(--manifest-path ../tools/parity-harness/Cargo.toml)
          step parity-fmt cargo fmt "${parity[@]}" --all -- --check
          step parity-clippy cargo clippy --locked "${parity[@]}" --workspace --all-targets -- -D warnings
          step parity-test cargo test --locked "${parity[@]}" --workspace
          cargo run --locked --quiet -p test-db-harness --bin affine-test-env -- \
            run-json --out ../.artifacts/server-harness/run.json --lane server-harness --status "$status" \
            --sha "${{ github.sha }}" --run-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --select frame-audit --select test-db-harness --select parity-harness "${timings[@]}"
          cat ../.artifacts/server-harness/run.json
          test "$status" = passed

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-harness-run
          path: .artifacts/server-harness/run.json
          if-no-files-found: ignore

  lint-and-wasm:
    name: Lint, Invariants & Wasm Check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: blocksuite/native-playground
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux fontconfig headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: blocksuite/native-playground -> target
          key: lint-wasm

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy check
        run: cargo clippy --locked --workspace --all-targets --features harness -- -D warnings

      - name: Static invariants and link-flag check
        run: ./scripts/check-invariants.sh

      - name: Perf guardrail self-tests and generated token/icon unit tests
        run: |
          node --test perf/compare-n3.test.mjs
          rustc --edition 2024 --test -D warnings tokens/tokens.rs -o /tmp/tokens_test && /tmp/tokens_test
          rustc --edition 2024 --test -D warnings tokens/icons.rs -o /tmp/icons_test && /tmp/icons_test
          rm -f /tmp/tokens_test /tmp/icons_test

      - name: Verify generated tokens, icons, and fonts.lock have zero drift
        run: |
          THEME_VER=$(awk '/^"@toeverything\/theme@/{f=1} f && /version:/{print $2; exit}' ../../yarn.lock)
          ICONS_VER=$(awk '/^"@blocksuite\/icons@/{f=1} f && /version:/{print $2; exit}' ../../yarn.lock)
          rm -rf /tmp/np-token-deps
          mkdir -p /tmp/np-token-deps/node_modules/@toeverything/theme /tmp/np-token-deps/node_modules/@blocksuite/icons
          curl -fsSL "https://registry.npmjs.org/@toeverything/theme/-/theme-${THEME_VER}.tgz" \
            | tar -xz --strip-components=1 -C /tmp/np-token-deps/node_modules/@toeverything/theme
          curl -fsSL "https://registry.npmjs.org/@blocksuite/icons/-/icons-${ICONS_VER}.tgz" \
            | tar -xz --strip-components=1 -C /tmp/np-token-deps/node_modules/@blocksuite/icons
          node tokens/extract-tokens.mjs --check --node-modules /tmp/np-token-deps/node_modules
          rm -rf /tmp/np-token-deps

      - name: Check WebAssembly target
        run: |
          cargo check --locked -p ui -p playground --target wasm32-unknown-unknown
          cargo check --locked -p blocksuite-playground-doc --no-default-features --target wasm32-unknown-unknown

  headless-linux-and-perf:
    name: Headless Linux, Web Smoke & Perf
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: blocksuite/native-playground
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Mesa Lavapipe Vulkan driver and headers
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libfontconfig1-dev libfreetype-dev lld

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: |
          WBG_VERSION=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/"/, "", $3); print $3; exit}' Cargo.lock)
          URL="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WBG_VERSION}/wasm-bindgen-${WBG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          if curl -fsSL "$URL" -o /tmp/wbg.tar.gz; then
            tar -xzf /tmp/wbg.tar.gz -C /tmp
            sudo install -m 0755 "/tmp/wasm-bindgen-${WBG_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/wasm-bindgen
          else
            cargo install --locked wasm-bindgen-cli --version "$WBG_VERSION"
          fi
          wasm-bindgen --version

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: blocksuite/native-playground -> target
          key: headless-linux

      - name: Run workspace unit tests (default and harness)
        run: |
          cargo test --locked --workspace
          cargo test --locked --workspace --features harness

      - name: Build WebAssembly bundle and run headless Chromium smoke test
        run: |
          mkdir -p artifacts web/pkg
          cargo build --locked -p playground --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --out-dir web/pkg target/wasm32-unknown-unknown/release/playground.wasm
          WASM_RAW=$(wc -c < web/pkg/playground_bg.wasm | tr -d ' ')
          WASM_GZIP=$(gzip -9 -c web/pkg/playground_bg.wasm | wc -c | tr -d ' ')
          echo "WASM_RAW=$WASM_RAW" >> "$GITHUB_ENV"
          echo "WASM_GZIP=$WASM_GZIP" >> "$GITHUB_ENV"
          node scripts/web-smoke.mjs \
            --out artifacts/wasm-chromium.png \
            --out-edgeless artifacts/wasm-chromium-edgeless.png

      - name: Deterministic headless render, audit, 4-fps check, and 30-frame bench
        run: |
          mkdir -p artifacts
          cargo run --locked --bin bs-harness --features harness -- render \
            --out artifacts/linux-run1.png \
            --snapshot artifacts/linux-run1.json \
            --width 1280 \
            --height 800
          cargo run --locked --bin bs-harness --features harness -- render \
            --out artifacts/linux-run2.png \
            --snapshot artifacts/linux-run2.json \
            --width 1280 \
            --height 800
          sha1=$(sha256sum artifacts/linux-run1.png | awk '{print $1}')
          sha2=$(sha256sum artifacts/linux-run2.png | awk '{print $1}')
          echo "Run 1 SHA256: $sha1"
          echo "Run 2 SHA256: $sha2"
          test "$sha1" = "$sha2"
          cargo run --locked --bin bs-harness --features harness -- audit --snapshot artifacts/linux-run1.json
          cargo run --locked --bin bs-harness --features harness -- audit-states
          cargo run --locked --bin bs-harness --features harness -- fps-check
          cargo run --locked --bin bs-harness --features harness -- bench \
            --json artifacts/perf-metrics.json \
            --commit "${{ github.sha }}" \
            --web-wasm-raw "$WASM_RAW" \
            --web-wasm-gzip "$WASM_GZIP"

      - name: Compare against rolling N-3 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f perf/compare-n3.mjs ]; then
            node perf/compare-n3.mjs \
              --fetch-github \
              --repo "${{ github.repository }}" \
              --branch darksky/native-playground \
              --workflow native-playground.yml \
              --run-id "${{ github.run_id }}" \
              --current artifacts/perf-metrics.json \
              --json-out artifacts/perf-verdict.json \
              --fail-on-regression >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No perf/compare-n3.mjs present; skipping N-3 comparison." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload perf metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-metrics
          path: |
            blocksuite/native-playground/artifacts/perf-metrics.json
            blocksuite/native-playground/artifacts/perf-verdict.json
          if-no-files-found: ignore

      - name: Upload Linux headless and Web smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-linux-artifacts
          path: |
            blocksuite/native-playground/artifacts/linux-run1.png
            blocksuite/native-playground/artifacts/linux-run1.json
            blocksuite/native-playground/artifacts/wasm-chromium.png
            blocksuite/native-playground/artifacts/wasm-chromium-edgeless.png
          if-no-files-found: ignore

  macos-headless:
    name: macOS Metal + CoreText Headless
    runs-on: macos-15
    defaults:
      run:
        working-directory: blocksuite/native-playground
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: blocksuite/native-playground -> target
          key: macos-headless

      - name: Check workspace all targets
        run: cargo check --locked --workspace --all-targets --features harness

      - name: Run UI, doc, and playground tests (default and harness)
        run: |
          cargo test --locked -p ui -p blocksuite-playground-doc -p playground
          cargo test --locked -p ui -p blocksuite-playground-doc -p playground --features harness

      - name: Deterministic Metal headless render and audit
        run: |
          mkdir -p artifacts
          cargo run --locked --bin bs-harness --features harness -- render \
            --out artifacts/macos-run1.png \
            --snapshot artifacts/macos-run1.json \
            --width 1280 \
            --height 800
          cargo run --locked --bin bs-harness --features harness -- render \
            --out artifacts/macos-run2.png \
            --snapshot artifacts/macos-run2.json \
            --width 1280 \
            --height 800
          sha1=$(shasum -a 256 artifacts/macos-run1.png | awk '{print $1}')
          sha2=$(shasum -a 256 artifacts/macos-run2.png | awk '{print $1}')
          echo "Run 1 SHA256: $sha1"
          echo "Run 2 SHA256: $sha2"
          test "$sha1" = "$sha2"
          cargo run --locked --bin bs-harness --features harness -- audit --snapshot artifacts/macos-run1.json

      - name: Upload macOS headless artifacts
        uses: actions/upload-artifact@v4
        with:
          name: headless-macos-artifacts
          path: |
            blocksuite/native-playground/artifacts/macos-run1.png
            blocksuite/native-playground/artifacts/macos-run1.json

  js-room-coop:
    name: JS Room Coop & Rust-JS E2E
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack and cache Yarn
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            node_modules
          key: ${{ runner.os }}-yarn-np-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-np-

      - name: Install JS dependencies
        run: yarn install --immutable

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: blocksuite/native-playground -> target
          key: js-room-coop

      - name: Build bs-relay and bs_doc_driver
        working-directory: blocksuite/native-playground
        run: cargo build --locked -p blocksuite-playground-doc --bin bs-relay --example bs_doc_driver

      - name: Verify JS-authored surface snapshots without writeback
        working-directory: blocksuite/native-playground
        run: cargo test --locked -p blocksuite-playground-doc --example bs_doc_driver js_authored_surface

      - name: Lint, format, and typecheck JS room sync
        run: |
          yarn oxlint --deny-warnings \
            blocksuite/framework/sync/src/doc/source.ts \
            blocksuite/framework/sync/src/doc/peer.ts \
            blocksuite/framework/sync/src/__tests__/peer.unit.spec.ts \
            blocksuite/playground/apps/_common/sync/blob/mock-server.ts \
            blocksuite/playground/apps/_common/sync/room/index.ts \
            blocksuite/playground/apps/_common/sync/room/__tests__/room-sync.spec.ts \
            blocksuite/playground/apps/starter/utils/collection.ts \
            blocksuite/playground/vite.config.ts \
            blocksuite/playground/vitest.config.ts
          yarn oxfmt --check \
            blocksuite/framework/sync/src/doc/source.ts \
            blocksuite/framework/sync/src/doc/peer.ts \
            blocksuite/framework/sync/src/__tests__/peer.unit.spec.ts \
            blocksuite/playground/apps/_common/sync/blob/mock-server.ts \
            blocksuite/playground/apps/_common/sync/room/index.ts \
            blocksuite/playground/apps/_common/sync/room/__tests__/room-sync.spec.ts \
            blocksuite/playground/apps/starter/utils/collection.ts \
            blocksuite/playground/vite.config.ts \
            blocksuite/playground/vitest.config.ts
          ./node_modules/.bin/tsc -b \
            blocksuite/framework/sync/tsconfig.json \
            blocksuite/playground/tsconfig.json

      - name: Verify surface geometry oracle and live Rust-JS room sync
        env:
          BS_RELAY_BIN: ${{ github.workspace }}/blocksuite/native-playground/target/debug/bs-relay
          BS_DOC_DRIVER_BIN: ${{ github.workspace }}/blocksuite/native-playground/target/debug/examples/bs_doc_driver
        run: |
          (cd blocksuite/framework/sync && ../../../node_modules/.bin/vitest run)
          (cd blocksuite/playground && ../../node_modules/.bin/vitest run)
