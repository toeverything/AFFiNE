name: Flutter CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'packages/frontend/apps/flutter-app/**'
      - '.github/workflows/flutter-app-ci.yml'
  pull_request:
    paths:
      - 'packages/frontend/apps/flutter-app/**'
      - '.github/workflows/flutter-app-ci.yml'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend/apps/flutter-app

    steps:
      - uses: actions/checkout@v6

      - name: Cache Flutter SDK
        id: cache-flutter
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: ${{ runner.os }}-flutter-3.41

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend/apps/flutter-app

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter test
        run: flutter test

  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend/apps/flutter-app

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-apk
          path: packages/frontend/apps/flutter-app/build/app/outputs/flutter-apk/*.apk
