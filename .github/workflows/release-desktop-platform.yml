name: Release Desktop Platform

on:
  workflow_call:
    inputs:
      build_type:
        required: true
        type: string
      app_version:
        required: true
        type: string
      git_short_hash:
        required: true
        type: string
      runner:
        required: true
        type: string
      platform:
        required: true
        type: string
      arch:
        required: true
        type: string
      target:
        required: true
        type: string
      apple_codesign:
        required: false
        default: false
        type: boolean
      apple_signing_mode:
        required: false
        default: github-secrets
        type: string
      install_linux_deps:
        required: false
        default: false
        type: boolean
      enable_scripts:
        required: false
        default: false
        type: boolean
    outputs:
      files_to_be_signed:
        description: Files to be signed (Windows only)
        value: ${{ jobs.build.outputs.files_to_be_signed }}

permissions:
  actions: write
  contents: write
  security-events: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    outputs:
      files_to_be_signed: ${{ steps.get_files_to_be_signed.outputs.FILES_TO_BE_SIGNED }}
    env:
      BUILD_TYPE: ${{ inputs.build_type }}
      RELEASE_VERSION: ${{ inputs.app_version }}
      DEBUG: 'affine:*,napi:*'
      APP_NAME: affine
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      SKIP_GENERATE_ASSETS: 1
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: 'affine'
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_RELEASE: ${{ inputs.app_version }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app_version }}

      - name: Setup Node.js
        timeout-minutes: 10
        uses: ./.github/actions/setup-node
        with:
          extra-flags: workspaces focus @affine/electron @affine/monorepo @affine/nbstore @toeverything/infra
          hard-link-nm: false
          nmHoistingLimits: workspaces
          enableScripts: ${{ inputs.enable_scripts }}

      - name: Build AFFiNE native
        uses: ./.github/actions/build-rust
        with:
          target: ${{ inputs.target }}
          package: '@affine/native'

      - uses: actions/download-artifact@v4
        with:
          name: desktop-web
          path: packages/frontend/apps/electron/resources/web-static

      - name: Build Desktop Layers
        run: yarn affine @affine/electron build

      - name: Load Apple signing environment from GitHub secrets
        if: ${{ inputs.platform == 'darwin' && inputs.apple_codesign && inputs.apple_signing_mode == 'github-secrets' }}
        shell: bash
        run: |
          {
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
            echo "APPLE_CODESIGN_IDENTITY=${{ secrets.APPLE_CODESIGN_IDENTITY }}"
          } >> "$GITHUB_ENV"

      - name: Signing By Apple Developer ID
        if: ${{ inputs.platform == 'darwin' && inputs.apple_codesign && inputs.apple_signing_mode == 'github-secrets' }}
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASSWORD }}

      - name: Resolve Apple codesign identity
        if: ${{ inputs.platform == 'darwin' && inputs.apple_codesign }}
        shell: bash
        run: |
          if [[ -n "${APPLE_CODESIGN_IDENTITY:-}" ]]; then
            echo "APPLE_CODESIGN_IDENTITY=$APPLE_CODESIGN_IDENTITY" >> "$GITHUB_ENV"
            exit 0
          fi

          IDENTITY="$(security find-identity -v -p codesigning 2>/dev/null | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [[ -z "$IDENTITY" ]]; then
            echo "No Developer ID Application identity found in keychain" >&2
            exit 1
          fi

          echo "APPLE_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Check Apple signing environment
        if: ${{ inputs.platform == 'darwin' && inputs.apple_codesign }}
        shell: bash
        run: |
          [[ -n "${APPLE_ID:-}" ]] || { echo "APPLE_ID is required" >&2; exit 1; }
          [[ -n "${APPLE_PASSWORD:-}" ]] || { echo "APPLE_PASSWORD is required" >&2; exit 1; }
          [[ -n "${APPLE_TEAM_ID:-}" ]] || { echo "APPLE_TEAM_ID is required" >&2; exit 1; }
          [[ -n "${APPLE_CODESIGN_IDENTITY:-}" ]] || { echo "APPLE_CODESIGN_IDENTITY is required" >&2; exit 1; }

      - name: Install additional dependencies on Linux
        if: ${{ inputs.platform == 'linux' && inputs.install_linux_deps }}
        run: |
          df -h
          sudo add-apt-repository universe
          sudo apt install -y libfuse2 elfutils flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak update
          # some flatpak deps need git protocol.file.allow
          git config --global protocol.file.allow always
          # clean up apt cache to save disk space
          sudo -E apt-get -y purge azure-cli* zulu* hhvm* llvm* firefox* google* dotnet* aspnetcore* powershell* adoptopenjdk* mysql* php* mongodb* moby* snap* || true
          sudo -E apt-get -qq autoremove --purge
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android
          sudo apt-get clean
          rm -rf ~/.cache/yarn ~/.npm
          df -h

      - name: Remove nbstore node_modules (darwin/linux)
        if: ${{ inputs.platform != 'win32' }}
        shell: bash
        # node_modules of nbstore is not needed for building, and it will make the build process out of memory
        run: |
          cargo clean
          rm -rf packages/frontend/apps/electron/node_modules/@affine/nbstore/node_modules/@blocksuite
          rm -rf packages/frontend/apps/electron/node_modules/@affine/native/node_modules

      - name: Remove nbstore node_modules (windows)
        if: ${{ inputs.platform == 'win32' }}
        shell: bash
        run: |
          rm -rf packages/frontend/apps/electron/node_modules/@affine/nbstore/node_modules/@blocksuite/affine/node_modules
          rm -rf packages/frontend/apps/electron/node_modules/@affine/native/node_modules

      - name: Prepare local AI runtime assets
        if: ${{ inputs.platform == 'darwin' && inputs.arch == 'arm64' }}
        shell: bash
        run: |
          brew install libomp openssl@3
          LOCAL_AI_LIBOMP_ROOT="$(brew --prefix libomp)"
          export LOCAL_AI_LIBOMP_ROOT
          LOCAL_AI_OPENSSL_ROOT="$(brew --prefix openssl@3)"
          export LOCAL_AI_OPENSSL_ROOT
          LOCAL_AI_RUNTIME_SOURCE_ROOT="$PWD/.cache/local-ai-runtime/darwin-arm64"
          node packages/frontend/apps/electron/scripts/prepare-local-ai-runtime.mjs
          {
            echo "LOCAL_AI_LIBOMP_ROOT=$LOCAL_AI_LIBOMP_ROOT"
            echo "LOCAL_AI_OPENSSL_ROOT=$LOCAL_AI_OPENSSL_ROOT"
            echo "LOCAL_AI_RUNTIME_SOURCE_ROOT=$LOCAL_AI_RUNTIME_SOURCE_ROOT"
          } >> "$GITHUB_ENV"

      - name: make
        if: ${{ inputs.platform != 'win32' }}
        run: yarn affine @affine/electron make --platform="$TARGET_PLATFORM" --arch="$TARGET_ARCH"
        env:
          TARGET_PLATFORM: ${{ inputs.platform }}
          TARGET_ARCH: ${{ inputs.arch }}
          SKIP_WEB_BUILD: 1
          HOIST_NODE_MODULES: 1
          NODE_OPTIONS: --max-old-space-size=14384
          LOCAL_AI_RUNTIME_SOURCE_ROOT: ${{ env.LOCAL_AI_RUNTIME_SOURCE_ROOT }}

      - name: Verify staged local AI runtime assets
        if: ${{ inputs.platform == 'darwin' && inputs.arch == 'arm64' }}
        shell: bash
        run: |
          test -f packages/frontend/apps/electron/resources/local-ai/bin/llama-server
          test -f packages/frontend/apps/electron/resources/local-ai/lib/libllama-server-impl.dylib
          test ! -f packages/frontend/apps/electron/resources/local-ai/models/gemma-3-4b-it.gguf

      - name: Verify packaged local AI app assets
        if: ${{ inputs.platform == 'darwin' && inputs.arch == 'arm64' }}
        shell: bash
        env:
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          if [[ "$BUILD_TYPE" == "stable" ]]; then
            PRODUCT_NAME="AFFiNE"
          else
            PRODUCT_NAME="AFFiNE-$BUILD_TYPE"
          fi

          APP_PATH="packages/frontend/apps/electron/out/$BUILD_TYPE/${PRODUCT_NAME}-darwin-$TARGET_ARCH/${PRODUCT_NAME}.app"
          RESOURCES_PATH="$APP_PATH/Contents/Resources"

          test -d "$APP_PATH"
          test -f "$RESOURCES_PATH/local-ai/bin/llama-server"
          test -f "$RESOURCES_PATH/local-ai/lib/libllama-server-impl.dylib"
          test ! -f "$RESOURCES_PATH/local-ai/models/gemma-3-4b-it.gguf"

      - name: package
        if: ${{ inputs.platform == 'win32' }}
        run: |
          yarn affine @affine/electron package --platform="$TARGET_PLATFORM" --arch="$TARGET_ARCH"
        env:
          TARGET_PLATFORM: ${{ inputs.platform }}
          TARGET_ARCH: ${{ inputs.arch }}
          SKIP_WEB_BUILD: 1
          HOIST_NODE_MODULES: 1
          NODE_OPTIONS: --max-old-space-size=14384

      - name: Sign and validate DMG
        if: ${{ inputs.platform == 'darwin' && inputs.apple_codesign }}
        shell: bash
        env:
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          if [[ "$BUILD_TYPE" == "stable" ]]; then
            PRODUCT_NAME="AFFiNE"
          else
            PRODUCT_NAME="AFFiNE-$BUILD_TYPE"
          fi

          APP_PATH="packages/frontend/apps/electron/out/$BUILD_TYPE/${PRODUCT_NAME}-darwin-$TARGET_ARCH/${PRODUCT_NAME}.app"
          DMG_PATH="packages/frontend/apps/electron/out/$BUILD_TYPE/make/AFFiNE.dmg"

          [[ -d "$APP_PATH" ]] || {
            echo "Signed app not found: $APP_PATH" >&2
            exit 1
          }
          [[ -f "$DMG_PATH" ]] || {
            echo "DMG not found: $DMG_PATH" >&2
            exit 1
          }

          codesign --force --sign "$APPLE_CODESIGN_IDENTITY" "$DMG_PATH"
          xcrun stapler staple "$APP_PATH"
          xcrun stapler staple "$DMG_PATH"
          spctl -a -t exec -vv "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Save artifacts (mac)
        if: ${{ inputs.platform == 'darwin' }}
        env:
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          mkdir -p builds
          mv packages/frontend/apps/electron/out/*/make/*.dmg "./builds/affine-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-macos-$TARGET_ARCH.dmg"
          mv packages/frontend/apps/electron/out/*/make/zip/darwin/"$TARGET_ARCH"/*.zip "./builds/affine-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-macos-$TARGET_ARCH.zip"

      - name: Save artifacts (linux)
        if: ${{ inputs.platform == 'linux' }}
        env:
          TARGET_ARCH: ${{ inputs.arch }}
        run: |
          mkdir -p builds
          mv packages/frontend/apps/electron/out/*/make/zip/linux/"$TARGET_ARCH"/*.zip "./builds/affine-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-linux-$TARGET_ARCH.zip"
          mv packages/frontend/apps/electron/out/*/make/AppImage/"$TARGET_ARCH"/*.AppImage "./builds/affine-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-linux-$TARGET_ARCH.appimage"
          mv packages/frontend/apps/electron/out/*/make/deb/"$TARGET_ARCH"/*.deb "./builds/affine-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-linux-$TARGET_ARCH.deb"
          mv packages/frontend/apps/electron/out/*/make/flatpak/*/*.flatpak "./builds/affine-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-linux-$TARGET_ARCH.flatpak"

      - uses: actions/attest-build-provenance@v4
        if: ${{ inputs.platform == 'darwin' }}
        with:
          subject-path: |
            ./builds/affine-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-macos-${{ inputs.arch }}.zip
            ./builds/affine-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-macos-${{ inputs.arch }}.dmg

      - uses: actions/attest-build-provenance@v4
        if: ${{ inputs.platform == 'linux' }}
        with:
          subject-path: |
            ./builds/affine-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-linux-${{ inputs.arch }}.zip
            ./builds/affine-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-linux-${{ inputs.arch }}.appimage
            ./builds/affine-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-linux-${{ inputs.arch }}.deb
            ./builds/affine-${{ env.RELEASE_VERSION }}-${{ env.BUILD_TYPE }}-linux-${{ inputs.arch }}.flatpak

      - name: Upload Artifact
        if: ${{ inputs.platform == 'darwin' || inputs.platform == 'linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: affine-${{ inputs.platform }}-${{ inputs.arch }}-builds
          path: builds

      - name: get all files to be signed
        id: get_files_to_be_signed
        if: ${{ inputs.platform == 'win32' }}
        shell: pwsh
        run: |
          Set-Variable -Name FILES_TO_BE_SIGNED -Value ((Get-ChildItem -Path packages/frontend/apps/electron/out -Recurse -File | Where-Object { $_.Extension -in @(".exe", ".node", ".dll", ".msi") } | ForEach-Object { '"' + $_.FullName.Replace((Get-Location).Path + '\packages\frontend\apps\electron\out\', '') + '"' }) -join ' ')
          "FILES_TO_BE_SIGNED=$FILES_TO_BE_SIGNED" >> $env:GITHUB_OUTPUT
          echo $FILES_TO_BE_SIGNED

      - name: Zip artifacts for faster upload
        if: ${{ inputs.platform == 'win32' }}
        shell: pwsh
        run: Compress-Archive -CompressionLevel Fastest -Path packages/frontend/apps/electron/out/* -DestinationPath archive.zip

      - name: Save packaged artifacts for signing
        if: ${{ inputs.platform == 'win32' }}
        uses: actions/upload-artifact@v4
        with:
          name: packaged-${{ inputs.platform }}-${{ inputs.arch }}
          path: |
            archive.zip
            !**/*.map
