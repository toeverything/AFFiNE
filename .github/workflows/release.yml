name: Release

on:
  schedule:
    - cron: '0 9 * * *'

  workflow_dispatch:
    inputs:
      web:
        description: 'Release Web?'
        required: true
        type: boolean
        default: false
      desktop:
        description: 'Release Desktop?'
        required: true
        type: boolean
        default: false
      mobile:
        description: 'Release Mobile?'
        required: true
        type: boolean
        default: false
      ios-app-version:
        description: 'iOS App Store Version (Optional, use tag version if empty)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write
  packages: write
  security-events: write
  attestations: write
  issues: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      APP_VERSION: ${{ steps.prepare.outputs.APP_VERSION }}
      GIT_SHORT_HASH: ${{ steps.prepare.outputs.GIT_SHORT_HASH }}
      BUILD_TYPE: ${{ steps.prepare.outputs.BUILD_TYPE }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Release
        id: prepare
        uses: ./.github/actions/prepare-release

  cloud:
    name: Release Cloud
    if: ${{ inputs.web || github.event_name != 'workflow_dispatch' }}
    needs:
      - prepare
    uses: ./.github/workflows/release-cloud.yml
    secrets: inherit
    with:
      build-type: ${{ needs.prepare.outputs.BUILD_TYPE }}
      app-version: ${{ needs.prepare.outputs.APP_VERSION }}
      git-short-hash: ${{ needs.prepare.outputs.GIT_SHORT_HASH }}

  image:
    name: Release Docker Image
    runs-on: ubuntu-latest
    needs:
      - prepare
      - cloud
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          logout: false
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tag and Push Image to Personal GHCR
        env:
          GHCR_OWNER: andresmaqueo
          IMAGE_NAME: affine
          BUILD_TYPE: ${{ needs.prepare.outputs.BUILD_TYPE }}
          GIT_SHORT_HASH: ${{ needs.prepare.outputs.GIT_SHORT_HASH }}
          APP_VERSION: ${{ needs.prepare.outputs.APP_VERSION }}
        run: |
          echo "🔹 Tagging image for GHCR..."
          docker buildx imagetools create \
            --tag ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}:${BUILD_TYPE}-${GIT_SHORT_HASH} \
            ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}:${BUILD_TYPE}-${GIT_SHORT_HASH} || true

          echo "🔹 Creating stable tags..."
          docker buildx imagetools create \
            --tag ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}:${BUILD_TYPE} \
            ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}:${BUILD_TYPE}-${GIT_SHORT_HASH} || true

          docker buildx imagetools create \
            --tag ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}:${APP_VERSION} \
            ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}:${BUILD_TYPE}-${GIT_SHORT_HASH} || true

      - name: Verify GHCR Push
        run: |
          echo "✅ GHCR push completed to ghcr.io/${{ env.GHCR_OWNER }}/${{ env.IMAGE_NAME }}"

  desktop:
    name: Release Desktop
    if: ${{ inputs.desktop || github.event_name != 'workflow_dispatch' }}
    needs:
      - prepare
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      build-type: ${{ needs.prepare.outputs.BUILD_TYPE }}
      app-version: ${{ needs.prepare.outputs.APP_VERSION }}
      git-short-hash: ${{ needs.prepare.outputs.GIT_SHORT_HASH }}

  mobile:
    name: Release Mobile
    if: ${{ inputs.mobile }}
    needs:
      - prepare
    uses: ./.github/workflows/release-mobile.yml
    secrets: inherit
    with:
      build-type: ${{ needs.prepare.outputs.BUILD_TYPE }}
      app-version: ${{ needs.prepare.outputs.APP_VERSION }}
      git-short-hash: ${{ needs.prepare.outputs.GIT_SHORT_HASH }}
      ios-app-version: ${{ inputs.ios-app-version }}
