name: PR Title Lint

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
    branches:
      - canary

permissions:
  contents: read

jobs:
  check-pull-request-title:
    name: Check pull request title
    runs-on: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository && 'l4es-fast' || 'ubuntu-latest' }}
    if: ${{ github.event.action != 'edited' || github.event.changes.title != null }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn workspaces focus @affine/commitlint-config
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" | yarn workspace @affine/commitlint-config commitlint -g ./.commitlintrc.json
