name: Frontend release builds (highcpu benchmark)
on:
  workflow_dispatch:
    inputs:
      app-version:
        type: string
        default: '0.27.5'
      build-type:
        type: string
        default: canary
permissions:
  contents: read
jobs:
  build-web:
    name: Build @affine/web
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, l4es-highcpu]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}
      - name: Build Core
        run: yarn affine @affine/web build
        env:
          BUILD_TYPE: ${{ inputs.build-type }}
          RELEASE_ASSET_PREFIX: releases/${{ inputs.app-version }}/
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: affine-web
          SENTRY_RELEASE: ${{ inputs.app-version }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ${{ matrix.runner }}-web
          path: ./packages/frontend/apps/web/dist
          if-no-files-found: error
  build-admin:
    name: Build @affine/admin
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, l4es-highcpu]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}
      - name: Build Admin
        run: yarn affine @affine/admin build
        env:
          BUILD_TYPE: ${{ inputs.build-type }}
          RELEASE_ASSET_PREFIX: releases/${{ inputs.app-version }}/
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: affine-admin
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      - name: Upload admin artifact
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ${{ matrix.runner }}-admin
          path: ./packages/frontend/admin/dist
          if-no-files-found: error
  build-mobile:
    name: Build @affine/mobile
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, l4es-highcpu]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}
      - name: Build Mobile
        run: yarn affine @affine/mobile build
        env:
          BUILD_TYPE: ${{ inputs.build-type }}
          RELEASE_ASSET_PREFIX: releases/${{ inputs.app-version }}/
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: affine-mobile
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      - name: Upload mobile artifact
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ${{ matrix.runner }}-mobile
          path: ./packages/frontend/apps/mobile/dist
          if-no-files-found: error
