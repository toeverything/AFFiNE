apiVersion: v1
kind: Secret
metadata:
  name: server-config
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  front.json: {{ include "affine.serverConfig" (dict "root" . "port" .Values.front.app.port) | b64enc | quote }}
  graphql.json: {{ include "affine.serverConfig" (dict "root" . "port" .Values.graphql.service.port) | b64enc | quote }}
  worker.json: {{ include "affine.serverConfig" (dict "root" . "port" .Values.worker.app.port) | b64enc | quote }}
  database-url: {{ required "serverConfig.db.datasourceUrl is required" .Values.global.serverConfig.db.datasourceUrl | b64enc | quote }}
