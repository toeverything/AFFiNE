apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "graphql.fullname" . }}-database-migration
  labels:
    {{- include "graphql.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation

spec:
  template:
    spec:
      serviceAccountName: {{ include "graphql.serviceAccountName" . }}
      {{- with .Values.global.database.gcloud }}
      {{- if .enabled }}
      initContainers:
      - name: wait-for-cloud-sql-proxy
        image: busybox:1.36.1
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -ec
          - |
            until wget -q -T 2 -O /dev/null "http://{{ $.Values.global.database.host }}:9801/startup"; do
              echo "waiting for cloud sql proxy to become ready"
              sleep 2
            done
      {{- end }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        command: ["yarn", "predeploy"]
        env:
          # Prisma CLI still reads DATABASE_URL; derive it from the same config.
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: server-config
                key: database-url
          - name: NODE_ENV
            value: "{{ .Values.env }}"
          - name: AFFINE_ENV
            value: "{{ .Release.Namespace }}"
          - name: DEPLOYMENT_PLATFORM
            value: "gcp"
        volumeMounts:
          - name: server-config
            mountPath: /app/config.json
            subPath: graphql.json
            readOnly: true
        resources:
          requests:
            cpu: '100m'
            memory: '200Mi'
      volumes:
        - name: server-config
          secret:
            secretName: server-config
      restartPolicy: Never
  backoffLimit: 1
