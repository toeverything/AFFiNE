name: 'Prepare Server Test Environment'
description: 'Prepare Server Test Environment'

runs:
  using: 'composite'
  steps:
    - name: Initialize database
      shell: bash
      run: |
        psql -h localhost -U postgres -c "CREATE DATABASE affine;"
        psql -h localhost -U postgres -c "CREATE USER affine WITH PASSWORD 'affine';"
        psql -h localhost -U postgres -c "ALTER USER affine WITH SUPERUSER;"
      env:
        PGPASSWORD: affine

    - name: Run init-db script
      shell: bash
      env:
        NODE_ENV: test
      run: |
        yarn affine @affine/server prisma generate
        yarn affine @affine/server data-migration admit-legacy-context-blobs
        yarn affine @affine/server prisma migrate deploy
        yarn affine @affine/server data-migration run

    - name: Import config
      shell: bash
      run: |
        config="${SERVER_CONFIG:-{}}"
        jq \
          --arg enabled "${AFFINE_INDEXER_ENABLED:-true}" \
          --arg provider "${AFFINE_INDEXER_SEARCH_PROVIDER:-manticoresearch}" \
          --arg endpoint "${AFFINE_INDEXER_SEARCH_ENDPOINT:-http://localhost:9308}" \
          '
          def with_default($key; $value):
            if has($key) then . else . + {($key): $value} end;
          .indexer = ((.indexer // {})
            | with_default("enabled"; ($enabled == "1" or $enabled == "true"))
            | .provider = ((.provider // {})
              | with_default("type"; $provider)
              | with_default("endpoint"; $endpoint)))
          ' <<< "$config" > ./packages/backend/server/config.json
