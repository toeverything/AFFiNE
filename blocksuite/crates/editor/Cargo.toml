[package]
name = "blocksuite-editor"
workspace = "../../../packages/frontend"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["preview-typst"]
harness = ["ui/harness"]
preview-typst = ["blocksuite-preview/typst"]

[dependencies]
anyhow.workspace = true
blocksuite-playground-doc = { path = "../doc", default-features = false }
fontdb.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
ttf-parser.workspace = true
ui = { path = "../../../packages/ui/ui" }
ui-tokens = { path = "../../../packages/ui/tokens" }
unicode-bidi.workspace = true
unicode-linebreak = "0.1"
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
y-octo = { version = "0.4.0", default-features = false, features = ["session"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blocksuite-preview = { path = "../preview", default-features = false, features = ["math", "pdf", "mermaid", "svg-text"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
icu_segmenter.workspace = true

[dev-dependencies]
ui = { path = "../../../packages/ui/ui", features = ["harness"] }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
