[package]
name = "playground"
workspace = "../../../packages/frontend"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
harness = ["ui/harness", "blocksuite-editor/harness"]
preview-engine = ["blocksuite-editor/preview-engine"]

[[bin]]
name = "native-playground"
path = "src/main.rs"

[[bin]]
name = "bs-harness"
path = "src/bin/bs_harness/main.rs"
required-features = ["harness"]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
blocksuite-editor = { path = "../editor" }
blocksuite-playground-doc = { path = "../doc", default-features = false }
image.workspace = true
serde.workspace = true
serde_json.workspace = true
ui = { path = "../../../packages/ui/ui" }
y-octo = { version = "0.4.0", default-features = false, features = ["session"] }

[dev-dependencies]
tempfile = "3"
ui = { path = "../../../packages/ui/ui", features = ["harness"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = "0.26"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
blocksuite-playground-doc = { path = "../doc", features = ["server"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "BinaryType",
    "CloseEvent",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Location",
    "MessageEvent",
    "Response",
    "UrlSearchParams",
    "WebSocket",
    "Window",
] }
