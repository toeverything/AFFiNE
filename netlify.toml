[build]
  command = "yarn --immutable && yarn workspace @affine/web build"
  publish = "packages/frontend/apps/web/dist"

# Global build env (override in UI if needed)
[build.environment]
  NODE_VERSION = "20"
  NETLIFY_USE_YARN = "true"
  YARN_ENABLE_IMMUTABLE_INSTALLS = "true"
  # Set your backend URL in Site env or here per context

[context.production.environment]
  AFFINE_BACKEND_URL = "https://YOUR-BACKEND-URL"

[[redirects]]
  from = "/api/*"
  to = "${AFFINE_BACKEND_URL}/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/graphql"
  to = "${AFFINE_BACKEND_URL}/graphql"
  status = 200
  force = true

[[redirects]]
  from = "/socket.io/*"
  to = "${AFFINE_BACKEND_URL}/socket.io/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
