[workspace]

[package]
description  = "Renderer-independent geometry and interaction audit rules over serialized UI frame snapshots"
edition      = "2024"
license      = "MIT"
name         = "frame-audit"
publish      = false
rust-version = "1.88"
version      = "0.1.0"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
