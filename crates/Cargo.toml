[workspace]
members  = ["frame-audit", "test-db-harness", "server-types", "server-db"]
resolver = "3"

[workspace.package]
edition      = "2024"
license      = "MIT"
publish      = false
rust-version = "1.88"

[workspace.dependencies]
base64       = "0.22"
chrono       = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures-util = "0.3"
p256         = { version = "0.13", features = ["ecdsa", "pem"] }
postgres     = "0.19"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
sha2         = "0.10"
sqlx         = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
thiserror    = "2"
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "process"] }
uuid         = { version = "1", features = ["v4", "serde"] }

frame-audit     = { path = "frame-audit" }
server-db       = { path = "server-db" }
server-types    = { path = "server-types" }
test-db-harness = { path = "test-db-harness" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
